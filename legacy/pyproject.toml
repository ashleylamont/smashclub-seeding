[project]
name = "smashclub-seeding"
version = "0.1.0"
description = "SSBU Tournament Seeding Tool - Seeds players based on historical tournament performance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "glicko2",
    "python-dotenv",
    "pyyaml>=6.0.0",
    "requests",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# Pin the public index explicitly. The committed lock previously recorded an
# authenticated internal mirror, inherited from whichever machine ran `uv lock`
# — which made the project uninstallable anywhere else (401 Unauthorized) and
# meant CI could never install it. Declaring the index here keeps a relock on a
# corporate network from reintroducing that.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["test_seeding.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
