# Copy to secret.yaml (gitignored) or create with kubectl:
#   kubectl create secret generic smashclub-secrets \
#     --from-literal=DATABASE_URL=postgres://user:pass@postgres:5432/smashclub \
#     --from-literal=BETTER_AUTH_SECRET=$(openssl rand -hex 32) \
#     --from-literal=CHALLONGE_API_KEY=... \
#     --from-literal=CHALLONGE_USERNAME=... \
#     --from-literal=DISCORD_CLIENT_ID=... \
#     --from-literal=DISCORD_CLIENT_SECRET=... \
#     --from-literal=GOOGLE_CLIENT_ID=... \
#     --from-literal=GOOGLE_CLIENT_SECRET=... \
#     --from-literal=ADMIN_EMAILS=you@example.com
apiVersion: v1
kind: Secret
metadata:
  name: smashclub-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://user:pass@postgres:5432/smashclub
  BETTER_AUTH_SECRET: change-me
  CHALLONGE_API_KEY: ""
  CHALLONGE_USERNAME: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  ADMIN_EMAILS: you@example.com
