[project]
name = "smashclub-seeding"
version = "0.1.0"
description = "SSBU Tournament Seeding Tool - Seeds players based on historical tournament performance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test_seeding.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
