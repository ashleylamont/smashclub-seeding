name: Version Nemesis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nemesis-version-pr
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    env:
      RELEASE_APP_CONFIGURED: ${{ (vars.NEMESIS_RELEASE_APP_CLIENT_ID != '' || secrets.NEMESIS_RELEASE_APP_CLIENT_ID != '') && secrets.NEMESIS_RELEASE_APP_PRIVATE_KEY != '' && 'true' || 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELEASE_APP_CONFIGURED == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the trigger still matches main
        id: version-source
        if: env.RELEASE_APP_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-version-source.sh
      - name: Detect a Changeset directory with only release tooling
        id: empty-changesets
        if: steps.version-source.outputs.ready == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          # Let Changesets handle every unknown entry, including pre mode and legacy notes.
          if [[ -d .changeset && ! -L .changeset && -f .changeset/config.json ]] &&
            candidate="$(find .changeset -mindepth 1 -maxdepth 1 \
              ! \( -type f \( -name README.md -o -name config.json -o -name changelog.mjs \) \) \
              -print -quit)" &&
            [[ -z "$candidate" ]]; then
            echo 'No pending Changesets on the checked-out main.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-node-pnpm
        if: steps.version-source.outputs.ready == 'true' && steps.empty-changesets.outputs.skip != 'true'
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: release-token
        if: steps.version-source.outputs.ready == 'true' && steps.empty-changesets.outputs.skip != 'true'
        with:
          client-id: ${{ vars.NEMESIS_RELEASE_APP_CLIENT_ID || secrets.NEMESIS_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEMESIS_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Recheck main before Changesets updates the version PR
        id: version-source-final
        if: steps.version-source.outputs.ready == 'true' && steps.empty-changesets.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-version-source.sh
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        if: steps.version-source-final.outputs.ready == 'true'
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          version-script: pnpm changeset version
          commit-message: Version Nemesis
          pr-title: Version Nemesis
          pr-base-branch: main
          push-git-tags: false
          create-github-releases: false
      - name: Queue the version PR for merge after required checks
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          pr="$(gh pr view "$PR" --json state,headRefName,headRefOid,autoMergeRequest)"
          test "$(jq -r .headRefName <<< "$pr")" = changeset-release/main
          if jq -e '.state == "MERGED" or .autoMergeRequest != null' <<< "$pr" > /dev/null; then
            exit 0
          fi
          head="$(jq -r .headRefOid <<< "$pr")"
          gh pr merge "$PR" --auto --merge --match-head-commit "$head"
      - name: Report missing release App settings
        if: env.RELEASE_APP_CONFIGURED != 'true'
        run: echo 'Configure the Nemesis release App Client ID and private key before creating a version PR.'
