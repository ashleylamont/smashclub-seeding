# Every job here surfaces on a pull request as its own GitHub check run, named
# by the `name:` below. That is the point of the split: previously typecheck,
# unit tests, build and the bundle smoke test were four steps inside one `node`
# job, so a pull request got a single opaque red tick and you had to open the
# logs to learn which of the four had broken. They also ran in series, and the
# first failure hid every later one.
#
# `All checks` at the bottom is the aggregate gate. Branch protection should
# require that one check and nothing else — it is a stable name that stays
# correct as jobs are added or renamed here.
name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

# A pull request that gets pushed to again does not need its superseded run
# finished. Runs on main are never cancelled — main's history is the record of
# what was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-verification
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      # Vitest turns on its `github-actions` reporter by itself when it sees
      # GITHUB_ACTIONS, so a failing assertion is annotated on the diff line
      # rather than only in the log.
      - run: pnpm test

  e2e:
    name: Browser event flows (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Finish every shard so one failure does not hide the other diagnostics.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @smashclub/web exec playwright install --with-deps chromium
      - run: pnpm --filter @smashclub/web build
      # The root test:e2e command rebuilds. Use the already-built SPA here.
      # Each runner owns a fresh harness; files stay together and use one worker.
      - run: pnpm --filter @smashclub/web test:e2e --shard=${{ matrix.shard }}/4 --reporter=list,blob
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-blob-report-${{ matrix.shard }}
          overwrite: true
          path: apps/web/blob-report
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-page-captures-${{ matrix.shard }}
          overwrite: true
          path: apps/web/screenshots
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          overwrite: true
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e-report:
    name: Browser report
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-blob-report-*
          path: apps/web/blob-reports
          merge-multiple: true
      - name: Require every shard report
        run: |
          node --input-type=module -e "import { readdirSync } from 'node:fs'; if (readdirSync('apps/web/blob-reports').filter(f => f.endsWith('.zip')).length !== 4) throw new Error('Expected all four browser shard reports');"
      - run: pnpm --filter @smashclub/web exec playwright merge-reports --reporter=html ./blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          overwrite: true
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: error

  ui-quality:
    name: UI accessibility and visuals
    # Chromium screenshots are platform-specific. Commit Darwin baselines from
    # this job; the database-backed event flows continue on Linux above.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @smashclub/web exec playwright install chromium
      - run: pnpm --filter @smashclub/web test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-review
          path: |
            apps/web/playwright-report/ui
            apps/web/ui-test-results
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build
      # Handed to `bundle-smoke`, which is a separate check so "the bundle does
      # not start" reads as its own failure rather than as "build failed".
      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: apps/server/dist
          retention-days: 1
          if-no-files-found: error

  bundle-smoke:
    name: Server bundle boots
    needs: build
    runs-on: ubuntu-latest
    steps:
      # `pnpm build` only BUNDLES, and vitest runs from source — nothing else
      # here ever executed dist/index.js. So a bundle that cannot start shipped
      # clean: `yaml` was added as a dependency without being added to the
      # esbuild --external list, got inlined, and its internal CommonJS
      # require() became esbuild's throwing ESM shim ("Dynamic require of
      # 'process' is not supported"). The server died at import in BOTH
      # environments while CI was green.
      #
      # Starting it with no DATABASE_URL must fail at ENV VALIDATION — which
      # proves the whole module graph loaded first.
      #
      # The install is not optional here: the bundle deliberately leaves fastify,
      # pg, drizzle and friends external, so without node_modules it dies at
      # ERR_MODULE_NOT_FOUND long before env validation and this check would go
      # red for the wrong reason.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@v4
        with:
          name: server-bundle
          path: apps/server/dist
      - name: Start the bundle
        working-directory: apps/server
        run: |
          out=$(node dist/index.js 2>&1 || true)
          echo "$out"
          if grep -q 'Dynamic require' <<<"$out"; then
            echo "::error::Bundle inlined a CommonJS dependency. Add it to --external in apps/server/package.json."
            exit 1
          fi
          if ! grep -q 'DATABASE_URL' <<<"$out"; then
            echo "::error::Bundle did not reach env validation — it failed to load."
            exit 1
          fi

  legacy-python:
    name: Legacy Python tests
    # Identity/import tests for the unsupported historical Python archive.
    # test_smart_parsing.py and test_seeding.py are excluded on purpose: both
    # construct SeedingCalculator('tests/test_data.csv'), a fixture of real
    # player data that is deliberately not committed. Listing them here only
    # produced collection errors.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked fails if uv.lock has drifted from pyproject.toml; --extra dev
      # is what installs pytest, which a bare `uv run` does not.
      - run: |
          uv run --locked --extra dev pytest \
            tests/test_ordering.py \
            tests/test_registry_integration.py \
            tests/test_registry_bootstrap.py \
            tests/test_player_registry.py \
            tests/test_challonge_import.py \
            tests/test_main_challonge_config.py \
            -q

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - run: docker pull postgres:17.10-bookworm
      - run: pnpm test:postgres
        env:
          POSTGRES_TEST_CONTAINER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-contracts
          path: test-results/postgres.xml
          if-no-files-found: error
          retention-days: 7

  production-image:
    name: Production image runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: smashclub:smoke
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/production-image-smoke.sh
        env:
          SMOKE_IMAGE: smashclub:smoke
      - name: Save the tested image
        run: docker save smashclub:smoke | gzip > test-results/production-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-production-image
          path: test-results/production-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-image-logs
          path: test-results/image
          retention-days: 7
          if-no-files-found: error

  # Every listed dependency is mandatory. Skips/cancellations fail closed.
  all-checks:
    name: All checks
    if: always()
    needs:
      [
        typecheck,
        lint,
        format,
        test,
        e2e,
        e2e-report,
        ui-quality,
        build,
        bundle-smoke,
        legacy-python,
        postgres,
        production-image,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-required-jobs.mjs
