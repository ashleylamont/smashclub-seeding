# Publishes the deploy image (deploy/Dockerfile) to GHCR. This repo does not
# deploy itself — a separate homelab deployment repository consumes the image
# by pinning it to the digest published here.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ashleylamont/smashclub-seeding
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=https://github.com/ashleylamont/smashclub-seeding

      - uses: docker/setup-buildx-action@v4

      # Only linux/amd64 — the target cluster is x86 Talos, and building
      # arm64 as well would double build time for no benefit.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/ashleylamont/smashclub-seeding@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
