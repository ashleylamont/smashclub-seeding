# Full reusable CI runs for this exact SHA before registry credentials are available.
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No workflow_run/pull_request_target: fork code never reaches a privileged job.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: needs.verify.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Serialize tag writes, without cancelling a publication halfway through.
    concurrency:
      group: registry-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-production-image
          path: verified-image
      - name: Load the image that passed the runtime gate
        run: |
          gunzip -c verified-image/production-image.tar.gz | docker load
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' smashclub:smoke)" = "$GITHUB_SHA"
      # Read current main AFTER verification. Superseded runs publish only their SHA.
      - id: release
        run: node scripts/publication-tags.mjs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the locally built verified image
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag smashclub:smoke "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          echo '### Published verified image' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
