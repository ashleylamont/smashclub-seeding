# Full reusable CI runs for this exact SHA before registry credentials are available.
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No workflow_run/pull_request_target: fork code never reaches a privileged job.
  verify:
    concurrency:
      group: publish-verification-${{ github.ref }}
      queue: max
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: needs.verify.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    # Keep waiting publications queued while only one job writes registry tags.
    concurrency:
      group: registry-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-production-image
          path: verified-image
      - name: Load the image that passed the runtime gate
        run: |
          gunzip -c verified-image/production-image.tar.gz | docker load
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' smashclub:smoke)" = "$GITHUB_SHA"
      # Read current main after verification to protect the mutable image tag.
      - id: release
        run: node scripts/publication-tags.mjs
      - name: Check notes for a versioned image
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > /dev/null
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the locally built verified image
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag smashclub:smoke "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          echo '### Published verified image' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.publish.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish release notes and exact build tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          tag="v$VERSION"
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$tag" "$GITHUB_SHA" -m "Nemesis $VERSION"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" --json tagName --jq .tagName; then
            exit 0
          fi
          gh release create "$tag" --verify-tag \
            --title "Nemesis $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
