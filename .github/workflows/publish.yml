# Full reusable CI runs for this exact SHA before registry credentials are available.
name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Classify main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    # Classification only chooses a queue. Failure falls back to the original lane.
    continue-on-error: true
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        run: node scripts/publish-verification-lane.mjs

  numbered-source:
    name: Resolve the numbered release source
    needs: classify
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.classify.outputs.lane == 'version' || needs.classify.outputs.lane == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-numbered-publish.mjs

  # No workflow_run/pull_request_target: fork code never reaches a privileged job.
  verify:
    needs: classify
    if: ${{ !cancelled() }}
    concurrency:
      # Preserve the original main queue for releases already waiting there.
      group: >-
        ${{ (github.event_name == 'workflow_dispatch' || needs.classify.outputs.lane == 'ordinary') && 'publish-verification-main-ordinary'
        || (needs.classify.outputs.lane == 'ordinary-2' && 'publish-verification-main-ordinary-2')
        || 'publish-verification-refs/heads/main' }}
      queue: max
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-snapshot:
    needs: numbered-source
    if: needs.numbered-source.outputs.source_sha != '' && needs.numbered-source.outputs.source_sha != github.sha
    concurrency:
      group: publish-verification-numbered-snapshot
      queue: max
    uses: ./.github/workflows/ci.yml
    with:
      snapshot_sha: ${{ needs.numbered-source.outputs.source_sha }}
    permissions:
      contents: read

  publish:
    needs: [verify, numbered-source]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    outputs: &published
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: &registry-permissions
      contents: read
      packages: write
    env:
      VERIFIED_SHA: ${{ github.sha }}
      NUMBERED_RELEASE_SHA: ${{ needs.numbered-source.outputs.source_sha }}
      ARTIFACT_PREFIX: ''
    # Keep waiting publications queued while only one job writes registry tags.
    concurrency: &registry-queue
      group: registry-publication
      cancel-in-progress: false
      queue: max
    steps: &publish-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_PREFIX }}verified-production-image
          path: verified-image
      - name: Load the image that passed the runtime gate
        run: |
          gunzip -c verified-image/production-image.tar.gz | docker load
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' smashclub:smoke)" = "$VERIFIED_SHA"
      # Read current main after verification to protect the mutable image tag.
      - id: release
        run: node scripts/publication-tags.mjs
      - name: Check notes for a versioned image
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$VERIFIED_SHA" == "$GITHUB_SHA" ]]; then
            node scripts/release-notes.mjs "$VERSION" > /dev/null
          else
            git worktree add --detach "$RUNNER_TEMP/verified-release-source" "$VERIFIED_SHA"
            node "$RUNNER_TEMP/verified-release-source/scripts/release-notes.mjs" "$VERSION" > /dev/null
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the locally built verified image
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag smashclub:smoke "$tag"
            docker push "$tag"
          done <<< "$TAGS"
          echo '### Published verified image' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"

  publish-snapshot:
    needs: [verify-snapshot, numbered-source]
    if: needs.verify-snapshot.result == 'success'
    outputs: *published
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *registry-permissions
    concurrency: *registry-queue
    env:
      VERIFIED_SHA: ${{ needs.numbered-source.outputs.source_sha }}
      NUMBERED_RELEASE_SHA: ${{ needs.numbered-source.outputs.source_sha }}
      ARTIFACT_PREFIX: 'numbered-'
    steps: *publish-steps

  release:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: &release-permissions
      contents: write
    # Versions can finish CI in either order. Serialize the Latest decision and write.
    concurrency: &release-queue
      group: release-record-publication
      cancel-in-progress: false
      queue: max
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      VERIFIED_SHA: ${{ needs.publish.outputs.source_sha }}
    steps: &release-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish release notes and exact build tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_dir="$PWD"
          if [[ "$VERIFIED_SHA" != "$GITHUB_SHA" ]]; then
            source_dir="$RUNNER_TEMP/verified-release-source"
            git worktree add --detach "$source_dir" "$VERIFIED_SHA"
          fi
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$VERIFIED_SHA"
          tag="v$VERSION"
          node "$source_dir/scripts/release-notes.mjs" "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$VERIFIED_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$tag" "$VERIFIED_SHA" -m "Nemesis $VERSION"
            git push origin "refs/tags/$tag"
          fi
          node scripts/publish-release-record.mjs "$tag" "$RUNNER_TEMP/release-notes.md"

  release-snapshot:
    needs: publish-snapshot
    if: needs.publish-snapshot.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *release-permissions
    concurrency: *release-queue
    env:
      VERSION: ${{ needs.publish-snapshot.outputs.version }}
      VERIFIED_SHA: ${{ needs.publish-snapshot.outputs.source_sha }}
    steps: *release-steps
