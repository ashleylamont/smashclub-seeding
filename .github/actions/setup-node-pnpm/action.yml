name: Setup Node and pnpm
description: >-
  Install pnpm and Node and restore the workspace. Every Node job needs exactly
  this preamble; keeping it in one place stops the jobs drifting apart on Node
  version or install flags. Run actions/checkout first — a local action cannot
  be resolved before the repository is on disk.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
